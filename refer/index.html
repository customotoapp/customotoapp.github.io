<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CustoMoto! — Join via referral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref') || '';
    const playStoreUrl = 'https://play.google.com/store/apps/details?id=ph.customoto.app';
    const deepLink = 'customoto://refer?ref=' + encodeURIComponent(ref);

    window.location = deepLink;
    setTimeout(function() {
      window.location = playStoreUrl;
    }, 1500);
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;">
    Opening CustoMoto!...
  </p>
</body>
</html>
